<script>
const TALK = {"title": "Lesen statt raten – Intric Agentic Search", "subtitle": "Warum Agentic Search genauere Antworten liefert als klassisches RAG", "scenes": [{"name": "Vortrag", "src": "media/Vortrag.mp4", "ends": [5.4, 10.4, 15.95, 22.05, 27.75, 36.6, 44.6, 52.05, 56.95, 61.2, 65.6, 70.9, 77.1, 81.45, 84.95, 93.65, 98.65, 103.85]}], "steps": [{"si": 0, "k": 0, "note": "Worum es heute geht, in einem Satz: Die Genauigkeit einer KI-Antwort entscheidet sich bei der Suche, nicht erst beim Sprachmodell. Drei Punkte. Erstens das Problem: Ein klassisches RAG-System, wie es heute in vielen Häusern läuft, gibt dem Modell fünf ähnliche Textstücke. Was darin fehlt, kann das Modell nicht wissen, es kann nur raten. Zweitens der Unterschied: Intric Agentic Search liest wie ein Mensch. Es wählt zuerst das richtige Dokument, sucht gezielt, blättert weiter und sieht sich Pläne und Tabellen selbst an. Drittens die Wirkung: genauere Antworten, jede mit Beleg. Und weil jeder Assistent und jeder Chatbot im Haus auf derselben Suche aufbaut, macht eine bessere Suche alle diese Anwendungen zugleich besser. Das zeige ich Ihnen jetzt an einem einzigen Bild.", "chapter": "Worum es geht"}, {"si": 0, "k": 1, "note": "Ein einziges Bild begleitet uns durch die nächsten Minuten. Links Sie, mit einer Frage. In der Mitte das System, das die Antwort vorbereitet, und darin der Kontext: alles, was das Sprachmodell am Ende zu lesen bekommt. Rechts oben das Sprachmodell selbst. Es bekommt den ganzen Kontext und schickt genau eine Antwort zurück. Rechts unten der Wissensbestand: Intranet, Weisungen, Handbücher und Formulare, oft viele tausend Seiten. Mehr Teile braucht es nicht. Alles, was heute passiert, passiert zwischen diesen Teilen.", "chapter": "1 · Das Bild"}, {"si": 0, "k": 2, "note": "Einmal im Zeitraffer. Ihre Frage landet als Zeile im Kontext. Das System holt passende Textstellen aus dem Wissensbestand dazu, der ganze Kontext geht an das Modell, die Antwort kommt zurück zu Ihnen. Wichtig ist der Satz unten: Das Modell kennt Ihre Dokumente nicht. Es kennt nur, was in diesem Moment im Kontext steht. Die Genauigkeit einer Antwort entscheidet sich also, bevor das Modell schreibt, nämlich bei der Frage, welche Stellen in den Kontext kommen. Wenn Antworten heute nicht die Qualität haben, die Sie brauchen, liegt es meistens genau hier. Schauen wir uns an, woran das bei einem klassischen RAG-System typischerweise liegt.", "chapter": "1 · Das Bild"}, {"si": 0, "k": 3, "note": "Das hier ist ein typisches klassisches RAG-System, nicht unbedingt Ihres im Detail. Die Pipeline ist fest: Die Frage wird in einen Vektor umgewandelt, dann werden die ähnlichsten Textstücke gesucht. Nehmen wir eine einfache Bitte: Fasse Kapitel 8 zusammen. Im Wissensbestand leuchtet jetzt alles auf, wo Kapitel 8 vorkommt, und zwar umso heller, je öfter: das Inhaltsverzeichnis, ein Verweis in Kapitel 3, eine Fußnote. Das ist das Aktenschrank-Problem. Das System sieht, wo das Wort steht, aber nicht, warum es dort steht, und nicht, welche Quelle die maßgebliche ist.", "chapter": "2 · Klassisches RAG"}, {"si": 0, "k": 4, "note": "Dann die festen fünf. Die fünf ähnlichsten Stücke wandern in den Kontext: die Zeile im Inhaltsverzeichnis mit Kapitel 8 und Seite 112, der Verweis aus Kapitel 3, eine Fußnote und zwei Zufallstreffer. Das Modell macht daraus das Beste, was es kann: eine Zusammenfassung aus Randbemerkungen. Der Kern des Kapitels fehlt, weil er nie im Kontext stand. Das ist kein Fehler des Modells. Es hat schlicht das Falsche zu lesen bekommen. Ein Reranking ändert daran wenig: Es sortiert die fünf Stücke besser, holt aber das Kapitel nicht.", "chapter": "2 · Klassisches RAG"}, {"si": 0, "k": 5, "note": "Noch deutlicher bei einer Frage, die jeder Mensch sofort lösen würde: Was steht auf Seite 25? Für einen Vektor ist die Zahl 25 fast bedeutungslos. Es leuchten Stellen auf, in denen zufällig 25 vorkommt: 25 Tage Urlaub, 25 Prozent, eine Telefonnummer. Die Antwort nennt die falsche Seite oder erfindet eine. Seitenzahlen, Paragrafen, Tabellen, also genau das, worüber Fachleute in der Verwaltung sprechen, sind für Ähnlichkeit kaum sichtbar. Diese Pipeline kann nicht blättern, nicht weiterlesen und nicht hinsehen. Jetzt dieselbe Frage an Intric.", "chapter": "2 · Klassisches RAG"}, {"si": 0, "k": 6, "note": "Gleiche Frage, anderes System. Der Rahmen bleibt, aber statt einer festen Pipeline hat der Assistent jetzt Werkzeuge, und das Modell entscheidet nach jedem Schritt selbst, welches es als Nächstes benutzt. Der erste Griff geht nicht in den Text, sondern in den Katalog: Zu jeder Datei gibt es eine kurze Zusammenfassung. Wie ein Bibliothekar, der erst nachschaut, welches Buch gemeint ist, bevor er eines aufschlägt. Das verhindert, dass schwache Treffer aus fünfzig fremden Dateien die richtige Stelle verdrängen. Im Produkt heißt dieses Werkzeug browse_knowledge_files.", "chapter": "3 · Agentic Search"}, {"si": 0, "k": 7, "note": "Dann sucht der Agent in genau diesem Dokument, und er stellt bei jeder Suche selbst ein, wie viel Stichwort und wie viel Bedeutung zählt. Bei Paragraf 39 VwVfG zählt das exakte Stichwort, sonst wären 39 und 93 fast dasselbe. Bei der Frage, ob ein Bescheid begründet werden muss, zählt die Bedeutung: Das Gesetz spricht von der Begründung des Verwaltungsaktes, nicht von Bescheiden. Kapitel 8 ist ein exakter Begriff, also stichwortlastig. Treffer: Seite 112. Ein klassisches RAG hat für all diese Fragen eine einzige, feste Einstellung.", "chapter": "3 · Agentic Search"}, {"si": 0, "k": 8, "note": "Jetzt der Schritt, den klassisches RAG nicht kann. Jedes Textstück weiß, auf welcher Seite es steht. Der Agent liest also ab Seite 112 weiter, Seite für Seite, bis die Überschrift von Kapitel 9 kommt. Im Kontext landen nicht fünf verstreute Stücke, sondern das ganze Kapitel, und nur das. Dasselbe Prinzip beantwortet die Frage nach Seite 25: Der Agent ruft die Seite direkt auf, ganz ohne Ranking. Und findet er zu wenig, ist er angewiesen, anders zu formulieren oder den Katalog durchzugehen, bevor er sagt, dass es etwas nicht gibt.", "chapter": "3 · Agentic Search"}, {"si": 0, "k": 9, "note": "Jetzt erst schreibt das Modell, und zwar aus dem gelesenen Kapitel. Jede Aussage trägt ein Zitat mit Datei und Seite. Bei einer PDF öffnet ein Klick das Original direkt an der zitierten Seite, neben dem Gespräch. Ihre Fachleute müssen der Antwort also nicht glauben, sie können sie prüfen. Die naheliegende Frage ist: Woher weiß das System, wo Seite 112 ist und worum es in jeder Datei geht? Die Antwort liegt vor der ersten Frage, beim Hochladen.", "chapter": "3 · Agentic Search"}, {"si": 0, "k": 10, "note": "Jede Datei wird aufbereitet, sobald sie hochgeladen ist, im Hintergrund. Erster Schritt: Intric liest die Textebene, die in den meisten PDFs schon vorhanden ist. Nur Seiten, die es brauchen, gehen durch die Texterkennung: eingescannte Seiten, kaputter Text, Seiten mit großen Bildern oder Tabellen ohne Rahmen. Das wird Seite für Seite entschieden. Ein halb digitales, halb gescanntes Dokument wird also richtig behandelt. Die Texterkennung läuft lokal, ohne externen Dienst.", "chapter": "4 · Vor der ersten Frage"}, {"si": 0, "k": 11, "note": "Der zweite Schritt unterscheidet uns von klassischer Texterkennung. Klassisch entsteht eine Textwand: Tabellen verlieren ihre Spalten, Diagramme verschwinden. Intric zerlegt die Seite in ihre Teile: Textblöcke, Tabellen, Diagramme, Bilder. Tabellen werden so übertragen, dass jeder Wert unter seiner Spaltenüberschrift bleibt. Ein Vision-Modell beschreibt Diagramme und Bilder, und die Beschreibung steht genau dort, wo die Abbildung war. Damit kann man auch nach Bildinhalten suchen. Zeichnungen, Grundrisse und Karten werden als visuell markiert, und ihre Position auf der Seite wird gespeichert. Das brauchen wir gleich noch.", "chapter": "4 · Vor der ersten Frage"}, {"si": 0, "k": 12, "note": "Dritter Schritt. Jede Datei bekommt eine kurze Zusammenfassung. Das ist der Katalog, den der Agent vorhin als Erstes gelesen hat. Parallel wird der Text in kleine Stücke geteilt, an natürlichen Grenzen wie Absätzen, und nie über eine Seitengrenze hinweg. Jedes Stück trägt seine Seitenzahl und Position und wird doppelt abgelegt: für die Stichwortsuche und für die Bedeutungssuche. Genau deshalb konnte der Agent Seite 112 finden und von dort weiterblättern. Und damit zum stärksten Punkt: Dokumente, deren Antwort nicht im Text steht, sondern im Bild.", "chapter": "4 · Vor der ersten Frage"}, {"si": 0, "k": 13, "note": "Bisher ging es um Text. Viele Antworten stehen aber nicht im Fließtext, sondern in einer Tabelle, einem Diagramm, einem Organigramm, einer Prozessgrafik, einem eingescannten Formular oder einem Plan. Ein klassisches System hat dort nur die Texterkennung: einzelne Wörter und Zahlen ohne Lage und ohne Bezug, also Werte ohne ihre Spalte und Beschriftungen ohne ihren Pfeil. Der Agent kann sich solche Stellen dagegen selbst ansehen, bei jeder Art von komplexem Dokument. Ich zeige das an einem Beispiel, an dem man es besonders gut sieht: einem Plan.", "chapter": "5 · Die Sandbox"}, {"si": 0, "k": 14, "note": "Die Frage: Welche lichte Raumhöhe hat Büro 2.04? Die Antwort steht in der Zeichnung. In der Gesamtansicht sind Maße und Beschriftungen so klein, dass auch ein gutes Modell sie nicht lesen kann. Genauso geht es einer dicht gesetzten Tabelle auf einer ganzen Seite oder der Beschriftung in einem Organigramm. Ein klassisches System liefert hier lose Wörter wie 2,50, 2.04 und RH, kann Maß und Raum nicht zuordnen und antwortet mit keine Angabe gefunden oder mit einer geratenen Zahl. Die Zeichnung ist ein synthetisches Beispiel.", "chapter": "5 · Die Sandbox"}, {"si": 0, "k": 15, "note": "Hier kommt die Sandbox ins Bild: ein eigener, abgeschotteter Rechner für jedes Gespräch, ohne Netzwerk, die Dateien darin nur lesbar. Der Suchtreffer enthält dank der Vorbereitung beim Upload bereits die Position der Abbildung auf Seite 7. Der Agent schneidet in der Sandbox genau diesen Bereich aus, mit bis zu 300 dpi, mit einem ganz normalen Befehl wie pdftoppm. Rechts sehen Sie, was dabei entsteht: Aus dem unlesbaren Ausschnitt wird eine Ansicht, in der jedes Detail lesbar ist. Nach demselben Prinzip kann der Agent einzelne Seiten gezielt als Text lesen, ohne das ganze Dokument zu laden.", "chapter": "5 · Die Sandbox"}, {"si": 0, "k": 16, "note": "Das Modell betrachtet den Ausschnitt selbst, nicht eine Textbeschreibung davon, und liest das Maß direkt ab: lichte Raumhöhe 2,50 Meter, mit Zitat auf Seite 7. Das gilt für jedes komplexe Dokument. Der Agent zoomt in eine Tabellenzeile, liest Werte aus einem Diagramm, folgt den Linien eines Organigramms oder entziffert ein eingescanntes Formular. Überall dort, wo die Antwort im Bild steht, schaut er hin. Falls gefragt: Die Sandbox gibt es derzeit in den von Intric gehosteten Umgebungen, nicht im On-Premises-Paket, und sie braucht ein Modell mit Bildverständnis.", "chapter": "5 · Die Sandbox"}, {"si": 0, "k": 17, "note": "Damit sind wir bei der Ausgangsfrage: Was liest das Modell, bevor es antwortet? Bei einem klassischen RAG sind es fünf ähnliche Fragmente, ausgewählt nach einer festen Regel. Es kann nicht blättern, nicht weiterlesen und nicht hinsehen. Bei Intric entscheidet der Agent: erst das richtige Dokument, dann die richtige Gewichtung, dann weiterlesen, bis das Kapitel vollständig ist, und bei Tabellen, Grafiken oder Plänen hinsehen. Jede Antwort mit Beleg. Und das ist der Hebel für Ihre ganze Organisation: Ihr Chatbot, künftige Fachassistenten, jede weitere KI-Anwendung ist nur so gut wie das, was sie liest. Eine genauere Suche macht jede dieser Anwendungen genauer, ohne dass Sie das Modell wechseln. Genaue, belegte Antworten schaffen Vertrauen, und erst mit Vertrauen nutzen Mitarbeitende KI im Alltag, statt jede Antwort nachzuprüfen. Am überzeugendsten ist das an Ihren eigenen Dokumenten. Bringen Sie die schwierigsten mit, dann vergleichen wir direkt.", "chapter": "Zum Schluss"}]};
const S = TALK.scenes, ST = TALK.steps;
const [mainTitle] = TALK.title.split(' – ');
document.title = mainTitle;
document.getElementById('t').innerHTML = mainTitle.replace(/(\S+)$/, '<em>$1</em>');
document.getElementById('sub').textContent = TALK.subtitle || '';
document.getElementById('n').textContent = ST.length + ' Schritte';

// Sync mit presenter.html: BroadcastChannel (http) + postMessage (auch file://)
const ch = 'BroadcastChannel' in window ? new BroadcastChannel('talk:' + TALK.title) : null;
const tell = m => { ch && ch.postMessage(m); window.opener && window.opener.postMessage(m, '*'); };
const onMsg = d => { if (!d) return; if (d.go !== undefined) show(d.go, d.instant); if (d.hello) tell({ at: cur }); };
if (ch) ch.onmessage = e => onMsg(e.data);
addEventListener('message', e => onMsg(e.data));

// Zwei Video-Elemente: das obere zeigt, das untere lädt die nächste Szene vor
const V = [document.getElementById('v0'), document.getElementById('v1')];
let top_ = 0, cur = -1, holdId = 0;
function load(v, si) { if (v.dataset.si !== String(si)) { v.dataset.si = si; v.src = S[si].src; v.load(); } }
function startOf(st) { return st.k ? S[st.si].ends[st.k - 1] : 0; }
function endOf(st) { return S[st.si].ends[st.k]; }

// Bis kurz vor die Schrittgrenze spielen und dort anhalten (0,06 s davor ist dasselbe ruhige Bild).
function hold(v, end) {
  cancelAnimationFrame(holdId);
  const tick = () => {
    if (v.currentTime >= end - 0.1) { v.pause(); v.currentTime = Math.max(0, end - 0.06); return; }
    holdId = requestAnimationFrame(tick);
  };
  holdId = requestAnimationFrame(tick);
}
function seek(v, t) {
  return new Promise(res => {
    if (v.readyState >= 2 && Math.abs(v.currentTime - t) < 0.03) return res();
    const done = () => res();
    v.addEventListener('seeked', done, { once: true });
    v.currentTime = t;
    setTimeout(done, 800);
  });
}
async function show(k, instant = false) {
  if (k < 0 || k >= ST.length) return;
  document.getElementById('start')?.remove();
  const st = ST[k], prev = cur >= 0 ? ST[cur] : null;
  cur = k; tell({ at: k });
  document.getElementById('nk').textContent = 'Sprechernotiz · ' + (k + 1) + ' / ' + ST.length;
  document.getElementById('nt').textContent = st.note || '';
  const from = instant ? endOf(st) - 0.06 : startOf(st);
  let v = V[top_];
  if (!prev || prev.si !== st.si) {
    let idx = V.findIndex(x => x.dataset.si === String(st.si));
    if (idx < 0) { idx = 1 - top_; load(V[idx], st.si); }
    v = V[idx];
    v.pause();
    await seek(v, from);
    if (cur !== k) return;
    if (idx !== top_) { top_ = idx; V[top_].style.zIndex = 2; V[1 - top_].style.zIndex = 1; }
    if (S[st.si + 1]) load(V[1 - top_], st.si + 1);
  } else if (instant || Math.abs(v.currentTime - from) > 0.25) {
    await seek(v, from);
  }
  if (instant) { v.pause(); return; }
  v.play().catch(() => {});
  hold(v, endOf(st));
}
const next = () => show(cur + 1);
const prev = () => show(cur - 1, true);
addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') show(0, true);
  else if (e.key === 'f') document.documentElement.requestFullscreen?.()?.catch(() => {});
  else if (e.key === 'n') document.getElementById('notes').classList.toggle('open');
});
document.getElementById('plink').addEventListener('click', e => e.stopPropagation());
document.getElementById('notes').addEventListener('click', e => e.stopPropagation());
addEventListener('click', () => next());
load(V[0], 0); if (S[1]) load(V[1], 1);
V[0].style.zIndex = 2; V[1].style.zIndex = 1;
</script>
